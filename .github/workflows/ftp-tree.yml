name: List FTP tree

on:
  workflow_dispatch:

jobs:
  tree:
    runs-on: ubuntu-latest
    steps:
      - name: Show directory layout
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          lftp -c "
            set ftp:ssl-force true;
            set ssl:verify-certificate no;
            set net:max-retries 1; set net:timeout 20;
            open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_SERVER';
            echo '=== addon domain root ==='; cls -1 ./threeohfivestudios.com/;
            echo '=== the aero dir ==='; cls -l ./threeohfivestudios.com/aero/;
          " 2>&1 | head -200
