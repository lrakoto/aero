name: List FTP tree

on:
  workflow_dispatch:

jobs:
  tree:
    runs-on: ubuntu-latest
    steps:
      # pixelmix.co is public info, so this probe needs no secrets and
      # tells us whether the transport works at all from GitHub's network.
      - name: Probe GoDaddy origin
        run: |
          sudo apt-get install -y -qq netcat-openbsd dnsutils >/dev/null
          H=pixelmix.co
          echo "=== resolves to ==="; dig +short $H
          for p in 21 990 22 2222; do
            printf "port %-5s " $p
            timeout 10 nc -zv $H $p 2>&1 | tail -1
          done
          echo "=== banner / FEAT on 21 ==="
          timeout 12 bash -c "exec 3<>/dev/tcp/$H/21; printf 'FEAT\r\nQUIT\r\n' >&3; timeout 8 cat <&3" 2>&1 | head -20 || echo "(port 21 unreachable)"
          echo "=== SSH banner on 22 ==="
          timeout 10 bash -c "exec 3<>/dev/tcp/$H/22; timeout 6 head -c 100 <&3" 2>&1 | head -3 || echo "(port 22 unreachable)"
